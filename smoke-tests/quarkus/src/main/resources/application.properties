quarkus.banner.enabled=false

# jackson-jq discovers its built-in functions and jq-library macros via java.util.ServiceLoader
# (see BuiltinFunctionLoader). Quarkus's native build disables GraalVM's default ServiceLoader
# feature and normally requires an extension to register services at build time; jackson-jq has
# no such extension yet, so fall back to GraalVM's own auto-registration.
quarkus.native.auto-service-loader-registration=true

quarkus.banner.enabled=false

# jackson-jq's builtins are registered in code (see BuiltinFunctionLoader), but importable modules
# are still discovered via java.util.ServiceLoader (ClassPathModuleLoader). Quarkus's native build
# disables GraalVM's default ServiceLoader feature and normally requires an extension to register
# services at build time; jackson-jq v2 has no such extension yet, so fall back to GraalVM's own
# auto-registration.
quarkus.native.auto-service-loader-registration=true

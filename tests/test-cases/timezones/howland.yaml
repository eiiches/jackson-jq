# macOS jq 1.7 already returns the newer timezone offset.
- q: 'strflocaltime("%Z %z")'
  in: 1700000000
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: true
  comment: 'on glibc before jq 1.8.0, the time handed to the C library carried no UTC offset, so %z wrote +0000'
  expectations:
    default:
    - v: '[1.5, 1.6)'
      out: []
      error: true
    - v: '[1.6, 1.8.0)'
      out:
      - "-12 +0000"
    - v: '[1.8.0, )'
      out:
      - "-12 -1200"
    overrides:
    - v: '[1.7, 1.8.0)'
      os: MACOS
      out:
      - "-12 -1200"


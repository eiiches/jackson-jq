- q: '([10, 20], 10, []) | @tsv?'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "10\t20"
      - ""
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false

- q: '(10, {a: 10}) | to_entries?'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [{"key": "a", "value": 10}]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:{key:STRING,value:10}]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:{key:STRING,value:10}]'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


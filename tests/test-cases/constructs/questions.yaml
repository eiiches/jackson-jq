- q: '([10, 20], 10, []) | @tsv?'
  out:
  - "10\t20"
  - ""
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'NULL'
    output: 'STRING'
  properties:
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false

- q: '(10, {a: 10}) | to_entries?'
  out:
  - [{"key": "a", "value": 10}]
  types:
  - input: 'ANY'
    output: '[*:{key:STRING,value:10}]'
  - input: 'NULL'
    output: '[*:{key:STRING,value:10}]'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'to_entries'
  in: [61, 62]
  out:
  - [{"key": 0, "value": 61}, {"key": 1, "value": 62}]
  types:
  - input: 'ANY'
    output: '[*:{key:STRING,value:ANY}]'
  - input: '[INT,INT]'
    output: 'ANY'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, )'


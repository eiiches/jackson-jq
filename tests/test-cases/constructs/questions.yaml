- q: '1,2,3 | label $out | if . == 2 then break $out? else . end'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 1
      - 3
    jjq:
    - v: '[1.5, )'
      compile_error: "syntax error, unexpected '?', expecting 'and' or 'or' or '//' or '==' or '!=' at line 1, column 47:\n    1,2,3 | label $out | if . == 2 then break $out? else . end\n                                                  ^"
      incompat_type: JACKSON_JQ_BUG
  justification: '? after break lebals does nothing. It doesn''t do any good to readability, either.'

- q: '1,2,3 | label $out | if . == 2 then break $out??? else . end'
  expectations:

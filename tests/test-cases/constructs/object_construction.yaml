- q: '{ a }'
  input: {"a": 1}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {"a": 1}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '{a:ANY}'
  - v: '[1.5, )'
    input: '{a:INT}'
    output: '{a:INT}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '{ a, }'
  input: {"a": 1}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {"a": 1}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '{a:ANY}'
  - v: '[1.5, )'
    input: '{a:INT}'
    output: '{a:INT}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '{(.): empty}'
  input: 1
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '{}'
  - v: '[1.5, )'
    input: 'INT'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: true
    depends_on_external_state: false

- q: '{(.): (."foo"?)}'
  input: [1]
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '{*:ANY}'
  - v: '[1.5, )'
    input: '[INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try {(.): error("boom")} catch .'
  input: 1
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "boom"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'INT'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try {(.): 1} catch .'
  input: 1
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "Cannot use number (1) as object key"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'INT'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

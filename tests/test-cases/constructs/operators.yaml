    depends_on_external_state: false

# The left operand of // stops before the assignment, so "x" is never asked to be a path expression.
- q: '"x" // .a = 1'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "x"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: '"x"|{a:1}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# A comma stays looser than //, so only the second assignment gets an alternative.
- q: '.a = 1, .b = 2 // 3'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {"a": 1}
      - {"b": 2}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: '3|{a:1}|{b:2}'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

# `or` stays tighter than the assignment, so it forms the assigned value rather than consuming it.
- q: '.a = 1 or 2'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {"a": true}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: '{a:true}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# All three levels at once: '(.a = empty) // (false or true)'.
- q: '.a = empty // false or true'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'true'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'true'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# `and` binds tighter than `or`, so this is 'true or (false and false)'.
- q: 'true or false and false'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'true'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'true'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

# `or` short-circuits on a truthy left operand, so neither operand of `and` is reached and the
# error is never raised.
- q: 'true or error("boom") and false'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'true'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'true'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

# The comparisons stay tighter than `and`: '(1 < 2) and (2 < 1)'.
- q: '1 < 2 and 2 < 1'

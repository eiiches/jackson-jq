- q: '{"x": 10} + . as {"a": $a} | {"y": $a}'
  in: {"a": 1, "b": 2}
  out:
  - {"x": 10, "y": 1}
  v: '[1.5, 1.8.0)'

- q: '{"x": 10} + . as {"a": $a} | {"y": $a}'
  in: {"a": 1, "b": 2}
  out:
  - {"y": 1}
  v: '[1.8.0, )'

- q: '({"x": 10} + .) as {"a": $a} | {"y": $a}'
  in: {"a": 1, "b": 2}
  out:
  - {"y": 1}

- q: '{"x": 10} + (. as {"a": $a} | {"y": $a})'
  in: {"a": 1, "b": 2}
  out:
  - {"x": 10, "y": 1}

- q: '1 + 3 as $a | ($a * 2)'
  in: null
  out:
  - 7
  v: '[1.5, 1.8.0)'

- q: '1 + 3 as $a | ($a * 2)'
  in: null
  out:
  - 8
  v: '[1.8.0, )'

- q: '1 + 3 | (. * 2)'
  in: null
  out:
  - 8

- q: '[1, 2 | . + 10]'
  in: null
  out:
  - [11, 12]

- q: '[1 | . + 1, . + 2]'
  in: null
  out:
  - [2, 3]

- q: '[1, 2 as $x | [$x, .]]'
  in: 0
  out:
  - [1, [2, 0]]

- q: '[1 as $x | $x, $x + 1]'
  in: null
  out:
  - [1, 2]

- q: '[1 | 2 as $x | [$x, .]]'
  in: null
  out:
  - [[2, 1]]

- q: '[1 as $x | 2 | [$x, .]]'
  in: null
  out:
  - [[1, 2]]

- q: '[1 as $x | 2 as $y | [$x, $y, .]]'
  in: null
  out:
  - [[1, 2, null]]

- q: '[1 | 2, 3 as $x | [$x, .]]'
  in: null
  out:
  - [2, [3, 1]]

- q: '[1, 2 as $x | 3, 4 | [$x, .]]'
  in: null
  out:
  - [1, [2, 3], [2, 4]]

- q: '{"x": 10} + . as {"a": $a} | {"y": $a}'
  input: {"a": 1, "b": 2}
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - {"x": 10, "y": 1}
    - v: '[1.8.0, )'
      output:
      - {"y": 1}
  types:
  - v: '[1.5, 1.8.0)'
    input: 'ANY'
    output: '{x:10,y:ANY}'
  - v: '[1.8.0, )'
    input: 'ANY'
    output: '{y:ANY}'
  - v: '[1.5, 1.8.0)'
    input: '{a:INT,b:INT}'
    output: '{x:10,y:INT}'
  - v: '[1.8.0, )'
    input: '{a:INT,b:INT}'
    output: '{y:INT}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


# The assignment operators bind tighter than //, so the alternative takes the whole assignment as its
# left operand. Here that operand is an object, which is truthy, so the alternative keeps it.
- q: '.a = false // "x"'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {"a": false}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: '"x"|{a:false}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# An assignment whose right-hand side emits nothing emits nothing itself, and never evaluates the
# path, so the alternative takes over even though the input cannot be indexed with a string.
- q: '.foo = empty // "number"'
  input: 21
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "number"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '"number"'
  - v: '[1.5, )'
    input: 'INT'
    output: '"number"'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


- q: '"path: \(path(.)|tojson)"'
  out:
  - "path: []"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'NULL'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try (path("path: \([1,2][])")) catch .'
  out:
  - "Invalid path expression with result \"path: 1\""
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '"\/"'
  out:
  - "/"
  types:
  - input: 'ANY'
    output: '"/"'
  - input: 'NULL'
    output: '"/"'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

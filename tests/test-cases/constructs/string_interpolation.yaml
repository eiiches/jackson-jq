- q: '"path: \(path(.)|tojson)"'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "path: []"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '["\(-1.0)", (-1.0 | tostring), ({n: -1.0} | tojson), (1.0 - 2.0 | tostring)]'
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - ["-1", "-1", "{\"n\":-1}", "-1"]
    - v: '[1.8.0, )'
      output:
      - ["-1.0", "-1.0", "{\"n\":-1.0}", "-1"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[STRING,STRING,STRING,STRING]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[STRING,STRING,STRING,STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try (path("path: \([1,2][])")) catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "Invalid path expression with result \"path: 1\""
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '"\/"'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "/"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '"/"'
  - v: '[1.5, )'
    input: 'NULL'
    output: '"/"'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

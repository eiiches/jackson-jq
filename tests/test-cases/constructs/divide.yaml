- q: '"foo" / "o"'
  out:
  - ["f", "", ""]
  types:
  - input: 'ANY'
    output: '[*:STRING]'
  - input: 'NULL'
    output: '[*:STRING]'

- q: '(("foo" // 1) / "foo")'
  in: "foo"
  out:
  - ["", ""]
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'ANY'
  v: '[1.5, )'

- q: '"" / ""'
  out:
  - []
  types:
  - input: 'ANY'
    output: '[*:STRING]'
  - input: 'NULL'
    output: '[*:STRING]'

- q: '"foo" / ""'
  out:
  - ["f", "o", "o"]
  types:
  - input: 'ANY'
    output: '[*:STRING]'
  - input: 'NULL'
    output: '[*:STRING]'

- q: '"" / "foo"'
  out:
  - []
  types:
  - input: 'ANY'
    output: '[*:STRING]'
  - input: 'NULL'
    output: '[*:STRING]'

- q: 'error("foo") / empty'
  out: []
  types:
  - input: 'ANY'
    output: 'NEVER'
  - input: 'NULL'
    output: 'NEVER'
  comment: 'rhs is evaluated first'

- q: 'try (empty / error("foo")) catch .'
  out:
  - "foo"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

- q: 'try (./nan) catch .'
  out:
  - "null (null) and number (null) cannot be divided"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

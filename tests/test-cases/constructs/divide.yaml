- q: '"foo" / "o"'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - ["f", "", ""]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:STRING]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '(("foo" // 1) / "foo")'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - ["", ""]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '"" / ""'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:STRING]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '"foo" / ""'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - ["f", "o", "o"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:STRING]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '"" / "foo"'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:STRING]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'error("foo") / empty'
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NEVER'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'NEVER'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'rhs is evaluated first'

- q: 'try (empty / error("foo")) catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "foo"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try (./nan) catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "null (null) and number (null) cannot be divided"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

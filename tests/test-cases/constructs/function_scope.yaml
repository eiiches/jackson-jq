# Fuzz iteration 4788: the inner arity-one definition must not replace the outer one.
- q: 'def f(a): ("foo 0") as $x | $x; @json "foo \(def f(a): []; ("true") < (-1.5) | f(-1.0))" | f({})'
  in: '"true"'
  out:
  - "foo 0"
  types:
  - input: 'ANY'
    output: '"foo 0"'
  - input: 'STRING'
    output: '"foo 0"'
  properties:
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  v: '[1.5, )'


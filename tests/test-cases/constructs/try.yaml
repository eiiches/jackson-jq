# An unparenthesized try covers only the next primary expression. Later comma
# operands can still emit values and raise errors after the try has finished.
- q: 'try .[0:1], .foo'
  in: "false"
  out:
  - "f"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - "f"
      error: true

# Reduced from fuzzing seed -1834952929741171381 (jq 1.8.2). The final
# assignment must fail after the slice and indices filters emit their values.
- q: 'try (.[null:-0.5]), indices("[]"), .foo += "x"'
  in: "false"
  out:
  - "false"
  - []
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - "false"
      - []
      error: true

# Keep the original fuzz expression to cover its URI format and interpolation.
- q: 'try (.[null : -0.5]), indices("[]"), .foo += @uri "foo \(pow(1; 0))"'
  in: "false"
  out:
  - "false"
  - []
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - "false"
      - []
      error: true

# Parentheses keep both comma operands inside the try.
- q: 'try (.[0:1], .foo)'
  in: "false"
  out:
  - "f"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'STRING'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

# Catch applies to the preceding try; the following comma operand runs after it.
- q: 'try error("boom") catch "caught", 1'
  in: null
  out:
  - "caught"
  - 1
  types:
  - input: 'ANY'
    output: '"caught"|1'
  - input: 'NULL'
    output: '"caught"|1'
  properties:
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false

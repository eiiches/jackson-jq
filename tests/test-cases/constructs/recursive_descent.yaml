- q: '[..]'
  input: {"a": null, "b": [null, 1]}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output:
      - [{"a": null, "b": [null, 1]}, [null, 1], 1]
    - v: '[1.6, )'
      output:
      - [{"a": null, "b": [null, 1]}, null, [null, 1], null, 1]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, 1.6)'
    input: '{a:NULL,b:[NULL,INT]}'
    output: '[*:INT|[NULL,INT]|{a:NULL,b:[NULL,INT]}]'
  - v: '[1.6, )'
    input: '{a:NULL,b:[NULL,INT]}'
    output: '[*:INT|NULL|[NULL,INT]|{a:NULL,b:[NULL,INT]}]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


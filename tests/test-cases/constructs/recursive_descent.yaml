# A null root is emitted in every supported jq version. Only null-valued descendants changed in 1.6.
- q: '[..]'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [null]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:NULL]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

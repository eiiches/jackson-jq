- q: '. as {b: $x, a: [$x, $y]} | [$x, $y]'
  in: {"a": [1, 2], "b": 3}
  out:
  - [3, 2]
  types:
  - input: 'ANY'
    output: '[ANY,ANY]'
  - input: '{a:[INT,INT],b:INT}'
    output: '[INT,INT]'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, )'
  comment: 'array elements are matched back to front, so .a[0] loses to the earlier .b'


- q: '. as {$a, $b: [$b, $c]} | [$a, $b, $c]'
  input: {"a": 1, "b": [2, {"d": 3}]}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: syntax error, unexpected ':', expecting ',' or '}' (Unix shell quoting issues?) at <top-level>, line 1:\n. as {$a, $b: [$b, $c]} | [$a, $b, $c]            \njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - [1, [2, {"d": 3}], {"d": 3}]
    jjq:
    - v: '[1.5, 1.6)'
      output:
      - [1.0, [2.0, {"d": 3.0}], {"d": 3.0}]
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[ANY,ANY,ANY]'
  - v: '[1.5, )'
    input: '{a:INT,b:[INT,{d:INT}]}'
    output: '[INT,[INT,{d:INT}],{d:INT}]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


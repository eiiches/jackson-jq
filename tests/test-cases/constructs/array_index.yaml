  - [2, 4]
  - []
  - []
  - [3]
  - [4]
  types:
  - input: 'ANY'
    output: 'NULL|STRING|[*:ANY]'
  - input: '[[INT,INT],[INT,INT]]'
    output: '[*:INT]'


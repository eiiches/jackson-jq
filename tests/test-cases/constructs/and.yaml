- q: 'empty and error("foo")'
  out: []
  types:
  - input: 'ANY'
    output: 'NEVER'
  - input: 'NULL'
    output: 'NEVER'
  properties:
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'lhs is evaluated first'

- q: 'try (error("foo") and empty) catch .'
  out:
  - "foo"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '[path(limit(1; .a[]))]'
  input: {"a": [1, 2]}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output: []
      runtime_error: "jq: error (at <stdin>:0): Invalid path expression near attempt to access element 1 of [0,1]\n"
    - v: '[1.6, )'
      output:
      - [["a", 0]]
    jjq:
    - v: '[1.5, 1.6)'
      output:
      - [["a", 0]]
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:[*:NUMBER|STRING]]'
  - v: '[1.5, )'
    input: '{a:[INT,INT]}'
    output: '[*:[*:NUMBER|STRING]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'jq 1.5 does not keep the position across a label, so it loses a path jq 1.6 keeps; jackson-jq keeps it on every version'

- q: 'del(limit(1; .a[]))'
  input: {"a": [1, 2]}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output: []
      runtime_error: "jq: error (at <stdin>:0): Invalid path expression near attempt to access element 1 of [0,1]\n"
    - v: '[1.6, )'
      output:
      - {"a": [2]}
    jjq:
    - v: '[1.5, 1.6)'
      output:
      - {"a": [2.0]}
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - v: '[1.5, )'
    input: '{a:[INT,INT]}'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'jq 1.5 does not keep the position across a label, so it loses a path jq 1.6 keeps; jackson-jq keeps it on every version'

- q: '[foreach . as $x (0, 9; $x)]'
  input: "abc"
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - ["abc", null]
    - v: '[1.8.0, )'
      output:
      - ["abc", "abc"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, 1.8.0)'
    input: 'STRING'
    output: '[*:NULL|STRING]'
  - v: '[1.8.0, )'
    input: 'STRING'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'Before jq 1.8, foreach read `.` off the stack with DUPN when it entered the loop, which left a null behind: the source saw the real input only while the first init value ran, and null for every init value after it. jq 1.8.0 fixed foreach; reduce still does it.'

- q: '[foreach . as $x (0, 9; $x; $x)]'
  input: "abc"
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - ["abc", null]
    - v: '[1.8.0, )'
      output:
      - ["abc", "abc"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, 1.8.0)'
    input: 'STRING'
    output: '[*:NULL|STRING]'
  - v: '[1.8.0, )'
    input: 'STRING'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'The extract form reads the same source, so it sees the same null.'

- q: '[try ([path(foreach .a[] as $x (0, 9; $x))]) catch .]'
  input: {"a": [1, 2]}
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - ["Invalid path expression near attempt to access element \"a\" of null"]
    - v: '[1.8.0, )'
      output:
      - [[["a", 0], ["a", 1], ["a", 0], ["a", 1]]]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, )'
    input: '{a:[INT,INT]}'
    output: '[*:ANY]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'Under path tracking the null is a value the path no longer leads to, so before jq 1.8 the second init value cannot step off it.'

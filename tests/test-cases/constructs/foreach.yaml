- q: '[path(foreach .a[] as $x (1; null))]'
  input: {"a": [null, null]}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [["a", 0], ["a", 1]]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:[*:NUMBER|STRING]]'
  - v: '[1.5, )'
    input: '{a:[NULL,NULL]}'
    output: '[*:[*:NUMBER|STRING]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'only the source moves the traversal along; the accumulator is a value of its own'


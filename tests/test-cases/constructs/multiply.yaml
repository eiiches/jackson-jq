# jq 1.7 and 1.7.1 on macOS AARCH64 convert infinity to a large repetition count and do not finish promptly.
- q: 'infinite * ""'
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - null
    - v: '[1.7, )'
      output:
      - ""
    overrides:
    - v: '[1.7, 1.8.0)'
      os: MACOS
      arch: AARCH64
      timeout: true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|STRING'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'NULL|STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


- q: 'error("foo") * empty'
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NEVER'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'NEVER'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'rhs is evaluated first'

- q: 'try (empty * error("foo")) catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "foo"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '(try ((-1.5 * "baz")) catch ("__ERROR__"))'
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - "__ERROR__"
    - v: '[1.8.0, )'
      output:
      - null
    jjq:
    - v: '[1.5, 1.8.0)'
      output:
      - null
      incompat_type: JACKSON_JQ_BUG
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|STRING'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'NULL|STRING'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  justification: jq interprets this as -(1.5 * baz) while jackson-jq as (-1.5) * baz. Defer resolution to future versions.

- q: '(try ((-1.5 * "baz")) catch ("__ERROR__"))'
  expectations:
    default:
    - v: '[1.5, 1.8.0)'

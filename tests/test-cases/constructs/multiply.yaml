- q: '(1 * "bar")'
  input: [[0.0], true]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "bar"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|STRING'
  - v: '[1.5, )'
    input: '[[INT],BOOLEAN]'
    output: 'NULL|STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


- q: '(1 * "bar")'
  in: [[0.0], true]
  out:
  - "bar"
  types:
  - input: 'ANY'
    output: 'NULL|STRING'
  - input: '[[INT],BOOLEAN]'
    output: 'NULL|STRING'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


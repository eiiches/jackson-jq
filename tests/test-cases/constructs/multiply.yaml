- q: 'error("foo") * empty'
  out: []
  types:
  - input: 'ANY'
    output: 'NEVER'
  - input: 'NULL'
    output: 'NEVER'
  properties:
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'rhs is evaluated first'

- q: 'try (empty * error("foo")) catch .'
  out:
  - "foo"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '(try ((-1.5 * "baz")) catch ("__ERROR__"))'
  out:
  - "__ERROR__"
  types:
  - input: 'ANY'
    output: 'NULL|STRING'
  - input: 'NULL'
    output: 'NULL|STRING'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  v: '[1.5, 1.8.0)'
  failing: true
  justification: jq interprets this as -(1.5 * baz) while jackson-jq as (-1.5) * baz. Defer resolution to future versions.

- q: '(try ((-1.5 * "baz")) catch ("__ERROR__"))'
  out:
  - null

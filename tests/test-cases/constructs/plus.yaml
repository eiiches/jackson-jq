- q: 'error("foo") + empty'
  out: []
  types:
  - input: 'ANY'
    output: 'NEVER'
  - input: 'NULL'
    output: 'NEVER'
  properties:
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'rhs is evaluated first'

- q: 'try (empty + error("foo")) catch .'
  out:
  - "foo"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'
  properties:
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try (path(.[] + .[])) catch .'
  in: [1, 2]
  out:
  - "Invalid path expression with result 2"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '[INT,INT]'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'error("foo") + empty'
  out: []
  types:
  - input: 'ANY'
    output: 'NEVER'
  - input: 'NULL'
    output: 'NEVER'
  comment: 'rhs is evaluated first'

- q: 'try (empty + error("foo")) catch .'
  out:
  - "foo"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

- q: 'try (path(.[] + .[])) catch .'
  in: [1, 2]
  out:
  - "Invalid path expression with result 2"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '[INT,INT]'
    output: 'ANY'

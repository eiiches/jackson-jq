- q: '[path(.)]'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [[]]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

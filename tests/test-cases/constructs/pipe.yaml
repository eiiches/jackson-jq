- q: 'def myfirst(g): label $out | g | ., break $out; [myfirst(myfirst(1,2), 3)]'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [1]
    jjq:
    - v: '[1.5, )'
      output:
      - [1, 3]
      incompat_type: JACKSON_JQ_BUG
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:1|2|3]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:1|2|3]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  comment: 'Emits [1, 3]. `label`/`break` are matched by raw name at runtime (LabelPipeComponent, PipedQuery), but jq binds `break` to its lexically enclosing `label`. The inner myfirst is still on the stack while its output is consumed, so it swallows the outer `break $out`. Same bug reached through builtins: `[first(first(1,2), 3)]` emits [1, 3] from 1.6 on, where jq emits [1].'

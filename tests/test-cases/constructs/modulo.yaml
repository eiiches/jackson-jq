- q: '((-1.0 - -1.0) % -1.5)'
  input: [false]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 0
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: '[BOOLEAN]'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '(try ((((0.5 and 0.5), -1, ("foo" // 1)) % (null // 1))) catch ("__ERROR__"))'
  input: 0.5
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "__ERROR__"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '"__ERROR__"'
  - v: '[1.5, )'
    input: 'FLOAT'
    output: '"__ERROR__"'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '(try ((1 % true)) catch ("__ERROR__"))'
  input: true
  expectations:
    default:
    - v: '[1.5, )'

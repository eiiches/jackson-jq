    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try (1 % true) catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "number (1) and boolean (true) cannot be divided (remainder)"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'error("foo") % empty'
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NEVER'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'NEVER'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'rhs is evaluated first'

- q: 'try (empty % error("foo")) catch .'
  expectations:
    default:
    - v: '[1.5, )'

- q: '((-1.0 - -1.0) % -1.5)'
  in: [false]
  out:
  - 0
  types:
  - input: 'ANY'
    output: 'NUMBER'
  - input: '[BOOLEAN]'
    output: 'NUMBER'
  v: '[1.5, )'

- q: '(try ((((0.5 and 0.5), -1, ("foo" // 1)) % (null // 1))) catch ("__ERROR__"))'
  in: 0.5
  out:
  - "__ERROR__"
  types:
  - input: 'ANY'
    output: '"__ERROR__"'
  - input: 'FLOAT'
    output: '"__ERROR__"'
  v: '[1.5, )'

- q: '(try ((1 % true)) catch ("__ERROR__"))'
  in: true
  out:
  - "__ERROR__"
  types:
  - input: 'ANY'
    output: '"__ERROR__"'
  - input: 'BOOLEAN'
    output: '"__ERROR__"'
  v: '[1.5, )'

- q: 'try (1 % true) catch .'
  out:
  - "number (1) and boolean (true) cannot be divided (remainder)"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

- q: 'error("foo") % empty'
  out: []
  types:
  - input: 'ANY'
    output: 'NEVER'
  - input: 'NULL'
    output: 'NEVER'
  comment: 'rhs is evaluated first'

- q: 'try (empty % error("foo")) catch .'
  out:
  - "foo"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

- q: '(64.5 % nan)'
  in: 84
  out:
  - 64
  types:
  - input: 'ANY'
    output: 'NUMBER'
  - input: 'INT'
    output: 'NUMBER'
  v: '[1.5, 1.7)'

- q: '(64.5 % nan)'
  in: 84
  out:
  - null
  types:
  - input: 'ANY'
    output: 'NUMBER'
  - input: 'INT'
    output: 'NUMBER'
  v: '[1.7, )'
  failing: true

- q: '(nan % nan) | (., isnan)'
  in: 84
  out:
  - 0
  - false
  types:
  - input: 'ANY'
    output: 'BOOLEAN|NUMBER'
  - input: 'INT'
    output: 'BOOLEAN|NUMBER'
  v: '[1.5, 1.7)'

- q: '(nan % nan) | (., isnan)'
  in: 84
  out:
  - null
  - true
  types:
  - input: 'ANY'
    output: 'BOOLEAN|NUMBER'
  - input: 'INT'
    output: 'BOOLEAN|NUMBER'
  v: '[1.7, )'
  failing: true

  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - [false, false, "64"]
    - v: '[1.7, )'
      output:
      - [true, false, "null"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[BOOLEAN,BOOLEAN,STRING]'
  - v: '[1.5, )'
    input: 'INT'
    output: '[BOOLEAN,BOOLEAN,STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


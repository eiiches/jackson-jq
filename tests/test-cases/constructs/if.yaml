- q: 'if true then 1 else 2 end'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 1
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '1|2'
  - v: '[1.5, )'
    input: 'NULL'
    output: '1'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'if false then 1 end'
  input: 2
  expectations:
    default:
    - v: '[1.5, 1.7)'
      compile_error: "jq: error: syntax error, unexpected end (Unix shell quoting issues?) at <top-level>, line 1:\nif false then 1 end                \njq: error: Possibly unterminated 'if' statement at <top-level>, line 1:\nif false then 1 end\njq: 2 compile errors\n"
    - v: '[1.7, )'
      output:
      - 2
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - 2.0
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'INT'
    output: 'INT'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'if false then 1 elif false then 2 else 3 end'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 3
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '3'
  - v: '[1.5, )'
    input: 'NULL'
    output: '3'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'if false then 1 elif false then 2 end'
  input: 3
  expectations:
    default:
    - v: '[1.5, 1.7)'
      compile_error: "jq: error: syntax error, unexpected end (Unix shell quoting issues?) at <top-level>, line 1:\nif false then 1 elif false then 2 end                                  \njq: error: Possibly unterminated 'if' statement at <top-level>, line 1:\nif false then 1 elif false then 2 end\njq: 2 compile errors\n"
    - v: '[1.7, )'
      output:
      - 3
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - 3.0
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'INT'
    output: 'INT'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# Fuzz iteration 8436: a definition in a condition must not replace the outer function.
- q: 'def f: "outer"; if def f: true; f then [] else 0 end | f'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "outer"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '"outer"'
  - v: '[1.5, )'
    input: 'NULL'
    output: '"outer"'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'def f: "outer"; [if true then def f: "inner"; f else 0 end, f]'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - ["inner", "outer"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '["inner"|0,"outer"]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '["inner","outer"]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


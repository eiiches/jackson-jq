- q: 'empty or error("foo")'
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NEVER'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'NEVER'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: false
    depends_on_external_state: false
  comment: 'lhs is evaluated first'

- q: 'try (error("foo") or empty) catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "foo"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

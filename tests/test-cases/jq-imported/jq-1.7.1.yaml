- q: 'try ["ok", setpath([1]; 1)] catch ["ko", .]'
  input: {"hi": "hello"}
  expectations:
    default:
    - v: '[1.5, 1.8.2)'
      output:
      - ["ko", "Cannot index object with number"]
    - v: '[1.8.2, )'
      output:
      - ["ko", "Cannot index object with number (1)"]

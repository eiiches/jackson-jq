  - v: '[1.5, )'
    input: 'ANY'
    output: '["ko",ANY]|["ok",ANY]'
  - v: '[1.5, )'
    input: '{hi:STRING}'
    output: '["ko",ANY]|["ok",ANY]'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


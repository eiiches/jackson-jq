- q: '.[] as {$a, $b, c: {$d, $e}} ?// {$a, $b, c: [{$d, $e}]} | {$a, $b, $d, $e}'
  input: [{"a": 1, "b": 2, "c": {"d": 3, "e": 4}}, {"a": 1, "b": 2, "c": [{"d": 3, "e": 4}]}]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: syntax error, unexpected '?', expecting '|' (Unix shell quoting issues?) at <top-level>, line 1:\n.[] as {$a, $b, c: {$d, $e}} ?// {$a, $b, c: [{$d, $e}]} | {$a, $b, $d, $e}                             \njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - {"a": 1, "b": 2, "d": 3, "e": 4}
      - {"a": 1, "b": 2, "d": 3, "e": 4}
    jjq:
    - v: '[1.6, )'
      compile_error: "Assignment or label must be followed by pipes: .[] as {$a, $b, c: {$d, $e}}"
      incompat_type: UNCLASSIFIED


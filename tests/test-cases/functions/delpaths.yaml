- q: 'delpaths(empty)'
  in: true
  out: []
  types:
  - input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - input: 'BOOLEAN'
    output: 'ANY'
  v: '[1.5, )'

- q: 'delpaths([[{"start": "x", "end": "y"}]])'
  in: null
  out:
  - null
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'
  v: '[1.5, )'

- q: 'delpaths([["a",{"start":0,"end":2}]])'
  in: {}
  out:
  - {}
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '{}'
    output: 'ANY'
  v: '[1.5, )'

- q: 'delpaths([["a",[true]]])'
  in: {}
  out:
  - {}
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '{}'
    output: 'ANY'
  v: '[1.5, )'

- q: 'try delpaths([[true]]) catch .'
  in: {}
  out:
  - "Cannot delete boolean field of object"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '{}'
    output: 'ANY'
  v: '[1.5, )'
  failing: true

- q: 'delpaths([[1.9], [1e20]])'
  in: [0, 1, 2]
  out:
  - [0, 2]
  types:
  - input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - input: '[INT,INT,INT]'
    output: 'NULL|[*:ANY]|{*:ANY}'
  v: '[1.5, )'

- q: 'try (delpaths([[{}]])) catch .'
  in: [1, 2, 3]
  out:
  - "Start and end indices of an array slice must be numbers"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '[INT,INT,INT]'
    output: 'ANY'
  v: '[1.5, 1.7)'

- q: 'try (delpaths([[{}]])) catch .'
  in: [1, 2, 3]
  out:
  - "Array/string slice indices must be integers"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '[INT,INT,INT]'
    output: 'ANY'
  v: '[1.7, )'
  failing: true

- q: 'delpaths([[{"start": 1, "end": null}]])'
  in: [1, 2, 3]
  out:
  - [1]
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '[INT,INT,INT]'
    output: 'ANY'
  v: '[1.5, )'

- q: 'delpaths(empty)'
  input: true
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - v: '[1.5, )'
    input: 'BOOLEAN'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: true
    depends_on_external_state: false


- q: 'try delpaths([[true]]) catch .'
  input: {}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "Cannot delete boolean field of object"
    jjq:
    - v: '[1.5, 1.8.2)'
      output:
      - "Cannot index object with boolean"
      incompat_type: JACKSON_JQ_BUG
    - v: '[1.8.2, )'
      output:
      - "Cannot index object with boolean (true)"
      incompat_type: JACKSON_JQ_BUG
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '{}'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'delpaths([[1.9], [1e20]])'
  input: [0, 1, 2]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [0, 2]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - v: '[1.5, )'
    input: '[INT,INT,INT]'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try (delpaths([[{}]])) catch .'
  input: [1, 2, 3]
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "Start and end indices of an array slice must be numbers"
    - v: '[1.7, )'
      output:
      - "Array/string slice indices must be integers"
    jjq:
    - v: '[1.7, )'
      output:
      - "Start and end indices of an array slice must be numbers"
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[INT,INT,INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


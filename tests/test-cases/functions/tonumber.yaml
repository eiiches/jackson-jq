# jq 1.7 made "NaN" case-insensitive (in addition to the exact "NaN"/"NAN" spellings already
# accepted before that); lowercase "nan" errors pre-1.7 and succeeds from 1.7 on.
- q: '(try tonumber catch ("__ERROR__")) | [isnan, isinfinite, tostring]'
  input: "nan"
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - [false, false, "__ERROR__"]
    - v: '[1.7, )'
      output:
      - [true, false, "null"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[BOOLEAN,BOOLEAN,STRING]|[false,false,STRING]'
  - v: '[1.5, )'
    input: 'STRING'
    output: '[BOOLEAN,BOOLEAN,STRING]|[false,false,STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '("nan" | tonumber) | isnan'
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output: []
      runtime_error: "jq: error (at <stdin>:0): Invalid literal at EOF at line 1, column 3 (while parsing 'nan')\n"
    - v: '[1.7, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'BOOLEAN'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


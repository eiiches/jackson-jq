# number input is passed through unchanged
- q: 'tonumber'
  input: 5
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 5
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: 'INT'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'tonumber'
  input: 5.5
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 5.5
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: 'FLOAT'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


      - 5
    - v: '[1.8.0, )'
      output:
      - "__ERROR__"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '"__ERROR__"|NUMBER'
  - v: '[1.5, )'
    input: 'STRING'
    output: '"__ERROR__"|NUMBER'
  properties:
  - v: '[1.5, )'

# special float literals (Infinity/NaN family, case-insensitive, optional leading sign) are
# accepted on every supported version, unlike plain decimal numerals which go through BigDecimal
# first.
#
# These queries check nonfinite values with jq functions so the expected results remain JSON values.
- q: '("Infinity" | tonumber) > 1e300'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'BOOLEAN'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '("Infinity" | tonumber) | type'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "number"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '"number"'
  - v: '[1.5, )'
    input: 'NULL'
    output: '"number"'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '("infinity" | tonumber) > 1e300'

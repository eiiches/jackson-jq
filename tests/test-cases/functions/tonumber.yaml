# jq kept the exact literal only from 1.7 on; before that it narrowed every numeral it read through a
# double, so this one comes back as 2871948651097801000.
- q: 'tonumber'
  input: "2871948651097801136"
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - 2871948651097801000
    - v: '[1.7, )'
      output:
      - 2871948651097801136
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'tonumber'
  input: "1.50"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 1.5
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# Number comparison is scale-insensitive (1.50 == 1.5, in real jq too), so the case above cannot
# see the preserved scale; tostring can. Real jq only kept the extra precision from 1.7 on
# (1.5/1.6 print 3.141592653589793).
- q: 'tonumber | tostring'
  input: "3.14159265358979323846264338327950288"
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "3.141592653589793"
    - v: '[1.7, )'
      output:
      - "3.14159265358979323846264338327950288"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


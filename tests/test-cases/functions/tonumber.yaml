# jq 1.8 stopped accepting leading/trailing whitespace around an otherwise-valid numeral
# (plain numerals and the Infinity/NaN family alike); earlier versions trim it.
- q: 'tonumber'
  input: "  5  "
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - 5
    - v: '[1.8.0, )'
      output: []
      runtime_error: "jq: error (at <stdin>:0): string (\"  5  \") cannot be parsed as a number\n"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try tonumber catch ("__ERROR__")'

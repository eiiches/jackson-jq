- q: 'from_entries'
  input: {}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '{*:ANY}'
  - v: '[1.5, )'
    input: '{}'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try from_entries catch .'
  input: 1
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "Cannot iterate over number (1)"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'INT'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try from_entries catch .'
  input: [{"key": "a", "value": 1}, 1]
  expectations:
    default:
    - v: '[1.5, 1.8.2)'
      output:
      - "Cannot index number with string \"key\""
    - v: '[1.8.2, )'
      output:
      - "Cannot index number with string (\"key\")"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[{key:STRING,value:INT},INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try from_entries catch .'
  input: [{"key": "a", "value": 1}, 1]
  expectations:
    default:
    - v: '[1.5, 1.8.2)'
      output:
      - "Cannot index number with string \"key\""
    - v: '[1.8.2, )'
      output:
      - "Cannot index number with string (\"key\")"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[{key:STRING,value:INT},INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '{a: {key: "a", value: 1}} | from_entries'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - {"a": 1}
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try from_entries catch .'
  input: [{}]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "Cannot use null (null) as object key"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[{}]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '[paths]'
  input: [null]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output:
      - []
    - v: '[1.6, )'
      output:
      - [[0]]
  types:
  - v: '[1.5, )'
    input: 'ANY'

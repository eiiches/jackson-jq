- q: 'paths'
  input: [false]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [0]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]'
  - v: '[1.5, )'
    input: '[BOOLEAN]'
    output: '[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'paths'
  input: [[[null]]]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output:
      - [0]
      - [0, 0]
    - v: '[1.6, )'
      output:
      - [0]
      - [0, 0]
      - [0, 0, 0]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]'
  - v: '[1.5, )'
    input: '[[[NULL]]]'
    output: '[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'paths'
  input: [null]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output: []
    - v: '[1.6, )'
      output:
      - [0]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]'
  - v: '[1.5, )'
    input: '[NULL]'
    output: '[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

# jq >= 1.7.1 defines paths(f) as `path(..|select(f))|select(length > 0)`, which evaluates f on
# the root value as well. The empty path is still excluded from the output, so the only visible
# difference is that errors raised by f on the root now propagate.
- q: '[paths(endswith("foo"))]'
  input: 0.5
  expectations:
    default:
    - v: '[1.5, 1.7.1)'
      output:
      - []
    - v: '[1.7.1, )'
      output: []
      runtime_error: "jq: error (at <stdin>:0): endswith() requires string inputs\n"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  - v: '[1.5, )'
    input: 'FLOAT'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try [paths(endswith("foo"))] catch .'
  input: 0.5
  expectations:
    default:
    - v: '[1.5, 1.7.1)'
      output:
      - []
    - v: '[1.7.1, )'
      output:
      - "endswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'FLOAT'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '[paths(endswith("foo"))]'
  input: {"a": "xfoo"}
  expectations:
    default:
    - v: '[1.5, 1.7.1)'
      output:
      - [["a"]]
    - v: '[1.7.1, )'
      output: []
      runtime_error: "jq: error (at <stdin>:0): endswith() requires string inputs\n"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  - v: '[1.5, )'
    input: '{a:STRING}'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# The root is evaluated before any child path is emitted.
- q: 'try [paths(endswith("foo"))] catch .'
  input: {"a": "xfoo"}
  expectations:
    default:
    - v: '[1.5, 1.7.1)'
      output:
      - [["a"]]
    - v: '[1.7.1, )'
      output:
      - "endswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '{a:STRING}'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

# The root matches, but its (empty) path is still not emitted.
- q: '[paths(endswith("foo"))]'
  input: "xfoo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  - v: '[1.5, )'
    input: 'STRING'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# jq 1.5's `..` skips null-valued members, so paths/0 does not yield their paths; from 1.6 on it
# does.
- q: '[paths]'
  input: {"a": null}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output:
      - []
    - v: '[1.6, )'
      output:
      - [["a"]]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  - v: '[1.5, )'
    input: '{a:NULL}'
    output: '[*:[*:NUMBER|STRING|[*:ANY]|{end:ANY,start:ANY}]]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '[paths]'
  input: {"a": null}
  expectations:
    default:
    - v: '[1.5, 1.6)'

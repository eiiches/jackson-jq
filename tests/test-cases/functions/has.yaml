- q: 'has("baz")'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - false
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'BOOLEAN'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


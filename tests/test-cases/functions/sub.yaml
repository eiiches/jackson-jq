# The replacement is concatenated onto the text preceding the match, so null contributes
# nothing and any other non-string is a type error.
- q: '"abc" | sub("b"; null)'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "ac"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try ("abc" | sub("b"; 1)) catch .'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "string (\"a\") and number (1) cannot be added"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


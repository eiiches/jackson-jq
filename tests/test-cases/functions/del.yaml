- q: '[del(.[nan:2]), del(.[nan:nan])]'
  input: [0, 1, 2, 3, 4]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output: []
      runtime_error: "jq-1.5: ../../../jv_aux.c:47: parse_slice: Assertion `0 <= start && start <= end && end <= len' failed.\n"
    - v: '[1.6, 1.7)'
      output: []
      runtime_error: "jq-1.6: src/jv_aux.c:47: parse_slice: Assertion `0 <= start && start <= end && end <= len' failed.\n"
    - v: '[1.7, )'
      output:
      - [[2, 3, 4], []]
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - [[2.0, 3.0, 4.0], [0.0, 1.0, 2.0, 3.0, 4.0]]
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[NULL|[*:ANY]|{*:ANY},NULL|[*:ANY]|{*:ANY}]'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT,INT]'
    output: '[NULL|[*:ANY]|{*:ANY},NULL|[*:ANY]|{*:ANY}]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'map_values(select(.))'
  input: {"key1": true, "key2": false}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output:
      - null
    - v: '[1.6, )'
      output:
      - {"key1": true}
  types:
  - v: '[1.5, 1.7)'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.7, )'
    input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - v: '[1.5, 1.7)'
    input: '{key1:BOOLEAN,key2:BOOLEAN}'
    output: 'ANY'
  - v: '[1.7, )'
    input: '{key1:BOOLEAN,key2:BOOLEAN}'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


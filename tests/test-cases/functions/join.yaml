- q: '(try (join("foo")) catch ("__ERROR__"))'
  in: false
  out:
  - "__ERROR__"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'BOOLEAN'
    output: '"__ERROR__"'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, )'

- q: 'join(empty)'
  in: 0.7853981633974483
  out: []
  types:
  - input: 'ANY'

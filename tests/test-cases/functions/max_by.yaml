- q: 'max_by(nan)'
  in: [1, 2]
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '[INT,INT]'
    output: 'INT'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - 1

- q: 'max_by([nan])'
  in: [1, 2]

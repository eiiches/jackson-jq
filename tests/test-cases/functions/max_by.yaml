- q: 'max_by(nan)'
  input: [1, 2]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 1
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[INT,INT]'
    output: 'INT'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


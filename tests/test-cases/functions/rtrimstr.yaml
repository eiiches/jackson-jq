- q: 'rtrimstr(., .[0:1], [1,2,3])'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - ""
      - "foo"
      - "foo"
    - v: '[1.8.0, )'
      output:
      - ""
      - "foo"
      runtime_error: "jq: error (at <stdin>:0): endswith() requires string inputs\n"
  types:
  - v: '[1.5, 1.8.0)'
    input: 'ANY'
    output: 'BINARY|BOOLEAN|NULL|NUMBER|STRING|[*:ANY]|{*:ANY}'
  - v: '[1.8.0, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try rtrimstr("foo") catch .'
  input: 4
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - 4
    - v: '[1.8.0, )'
      output:
      - "endswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'INT'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


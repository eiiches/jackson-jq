- q: 'todate'
  in: 1000000000000000
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: '%Y is not padded, so a year past four digits is written with the digits it has'
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - "31690708-07-05T01:46:40Z"

# macOS jq 1.7 and later pad the year to four digits.
- q: 'todate'
  in: -62135596800
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - "1-01-01T00:00:00Z"
    overrides:
    - v: '[1.7, )'
      os: MACOS
      out:
      - "0001-01-01T00:00:00Z"

- q: 'map(todate)'
  in: [0, 1700000000]
  types:
  - input: 'ANY'
    output: '[*:STRING]'
  - input: '[INT,INT]'
    output: '[*:STRING]'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - ["1970-01-01T00:00:00Z", "2023-11-14T22:13:20Z"]


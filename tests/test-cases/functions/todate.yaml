- q: 'todate'
  in: 1700000000
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - "2023-11-14T22:13:20Z"


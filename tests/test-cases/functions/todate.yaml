# macOS jq 1.7 and later pad the year to four digits.
- q: 'todate'
  input: -62135596800
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "1-01-01T00:00:00Z"
    overrides:
    - v: '[1.7, )'
      os: MACOS
      output:
      - "0001-01-01T00:00:00Z"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'INT'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


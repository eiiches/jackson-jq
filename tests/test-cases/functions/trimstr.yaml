- q: 'try trimstr("foo") catch .'
  input: 4
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      compile_error: "jq: error: trimstr/1 is not defined at <top-level>, line 1:\ntry trimstr(\"foo\") catch .    \njq: 1 compile error\n"
    - v: '[1.8.0, )'
      output:
      - "startswith() requires string inputs"
  types:
  - v: '[1.8.0, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.8.0, )'
    input: 'INT'
    output: 'ANY'
  properties:
  - v: '[1.8.0, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


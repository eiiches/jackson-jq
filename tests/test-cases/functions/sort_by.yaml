- q: 'sort_by(nan)'
  in: [3, 1, 2]
  out:
  - [3, 1, 2]
  types:
  - input: 'ANY'
    output: '[*:ANY]'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, )'

- q: 'sort_by(if . % 2 == 0 then nan else 0 end)'
  in: [4, 1, 3, 2]
  out:
  - [4, 2, 1, 3]
  types:
  - input: 'ANY'
    output: '[*:ANY]'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, )'

- q: 'try sort_by(.) catch .'
  in: {a: 1}
  types:
  - input: 'ANY'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - 'object ({"a":1}) and array ([[1]]) cannot be sorted, as they are not both arrays'

- q: 'sort_by(nan)'
  input: [3, 1, 2]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [3, 1, 2]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, )'
    input: '[INT,INT,INT]'
    output: '[*:INT]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'sort_by(if . % 2 == 0 then nan else 0 end)'
  input: [4, 1, 3, 2]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [4, 2, 1, 3]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT]'
    output: '[*:INT]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try sort_by(.) catch .'
  input: {"a": 1}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "object ({\"a\":1}) and array ([[1]]) cannot be sorted, as they are not both arrays"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '{a:INT}'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

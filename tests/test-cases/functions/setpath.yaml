- q: 'try (setpath([{}]; 9)) catch .'
  input: [1, 2, 3]
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "Start and end indices of an array slice must be numbers"
    - v: '[1.7, )'
      output:
      - "Array/string slice indices must be integers"
    jjq:
    - v: '[1.7, )'
      output:
      - "Start and end indices of an array slice must be numbers"
      incompat_type: INTENTIONAL

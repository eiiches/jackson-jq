- q: 'setpath([]; 0)'
  input: {"a": 0}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 0
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '{a:INT}'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try setpath([{"start": "x", "end": "y"}]; []) catch .'
  input: null
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "Start and end indices of an array slice must be numbers"
    - v: '[1.7, )'
      output:
      - "Array/string slice indices must be integers"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


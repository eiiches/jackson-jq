- q: '[walk(if type == "number" then (., . + 10) else . end)]'
  input: {"b": 1}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\n[walk(if type == \"number\" then (., . + 10) else . end)] \njq: 1 compile error\n"
    - v: '[1.6, 1.7)'
      output:
      - [{"b": 11}]
    - v: '[1.7, )'
      output:
      - [{"b": 1}]
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.6, 1.7)'
    input: '{b:INT}'
    output: '[*:NULL|{*:NULL|NUMBER}]'
  - v: '[1.7, )'
    input: '{b:INT}'
    output: '[*:NULL|[*:ANY]|{*:ANY}]'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'jq 1.6 rebuilds the object with reduce, whose update keeps the last output of a generator f.'

- q: '[walk(if type == "number" then (., . + 10) else . end)]'
  input: {"b": 1}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\n[walk(if type == \"number\" then (., . + 10) else . end)] \njq: 1 compile error\n"
    - v: '[1.6, 1.7)'
      output:
      - [{"b": 11}]
    - v: '[1.7, )'
      output:
      - [{"b": 1}]
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.6, 1.7)'
    input: '{b:INT}'
    output: '[*:NULL|{*:NULL|NUMBER}]'
  - v: '[1.7, )'
    input: '{b:INT}'
    output: '[*:NULL|[*:ANY]|{*:ANY}]'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'jq 1.7 redefined walk/1 in terms of map_values, which keeps the first output of a generator f.'

- q: '[walk(if type == "number" then (., . + 10) else . end)]'
  input: [1, 2]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\n[walk(if type == \"number\" then (., . + 10) else . end)] \njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - [[1, 11, 2, 12]]
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.6, 1.7)'
    input: '[INT,INT]'
    output: '[*:[*:NUMBER]]'
  - v: '[1.7, )'
    input: '[INT,INT]'
    output: '[*:[*:ANY]]'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'Not version-dependent: both definitions descend into arrays with map, which collects every output.'

- q: 'walk(if type == "number" then empty else . end)'
  input: {"b": 1, "a": "x"}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\nwalk(if type == \"number\" then empty else . end)\njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - {"a": "x"}
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.6, 1.7)'
    input: '{a:STRING,b:INT}'
    output: 'NULL|{*:NULL|STRING}'
  - v: '[1.7, )'
    input: '{a:STRING,b:INT}'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.6, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  comment: 'f may produce no output for a member, in which case the member is dropped. The [1.7, ) definition uses _modify(.[]; w) rather than map_values(w) so this does not hit the `|= empty` error.'


  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\nwalk(if type == \"object\" then with_entries(.value += 1) else . end)\njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - {"b": 2, "a": 3}
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.6, 1.7)'
    input: '{a:INT,b:INT}'
    output: 'NULL|{*:NUMBER}'
  - v: '[1.7, )'
    input: '{a:INT,b:INT}'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


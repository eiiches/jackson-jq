- q: 'walk(.)'
  input: {"b": 1, "a": 2}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\nwalk(.)\njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - {"b": 1, "a": 2}
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.6, 1.7)'
    input: '{a:INT,b:INT}'
    output: 'NULL|{*:INT|NULL}'
  - v: '[1.7, )'
    input: '{a:INT,b:INT}'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'jq rebuilds the object from keys_unsorted, so walk/1 keeps the input field order instead of sorting it.'

- q: 'walk(.)'
  input: {"b": {"y": 1, "x": 2}, "a": [{"n": 1, "m": 2}]}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: walk/1 is not defined at <top-level>, line 1:\nwalk(.)\njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - {"b": {"y": 1, "x": 2}, "a": [{"n": 1, "m": 2}]}
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.6, 1.7)'
    input: '{a:[{m:INT,n:INT}],b:{x:INT,y:INT}}'
    output: 'NULL|{*:NULL|[*:ANY]|{*:ANY}}'
  - v: '[1.7, )'
    input: '{a:[{m:INT,n:INT}],b:{x:INT,y:INT}}'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'walk(if type == "object" then with_entries(.value += 1) else . end)'

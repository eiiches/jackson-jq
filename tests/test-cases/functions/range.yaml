- q: 'range([]; [0,0,0]; [0])'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - []
      - [0]
      - [0, 0]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false

- q: '[try (range((0, 1, error("foo")); (5, 10, error("bar")); (1, 2, error("baz")))) catch .]'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [0, 1, 2, 3, 4, 0, 2, 4, "baz"]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:ANY]'
  - v: '[1.5, )'
    input: 'NULL'
    output: '[*:ANY]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


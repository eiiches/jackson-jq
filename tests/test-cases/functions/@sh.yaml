- q: 'try (@sh) catch .'
  input: {"foo": false}
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "object ({\"foo\":false}) can not be escaped for shell"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '{foo:BOOLEAN}'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


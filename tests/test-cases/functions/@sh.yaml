- q: '@sh'
  input: 0.0
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "0"
    - v: '[1.7, )'
      output:
      - "0.0"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'INT'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


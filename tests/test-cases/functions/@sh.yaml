- q: 'try (@sh) catch .'
  in: {"foo": false}
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - 'object ({"foo":false}) can not be escaped for shell'
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: '{foo:BOOLEAN}'
    output: 'ANY'
  properties:
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


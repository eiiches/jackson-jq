- q: '@uri'
  in: 0.0
  out:
  - "0"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, 1.7)'

- q: '@uri'
  in: 0.0
  out:
  - "0.0"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.7, )'

- q: '@uri'
  in: "'[]'"
  expectations:
    default:
    - v: '[1.5, 1.7)'
      out:
      - "'%5B%5D'"
    - v: '[1.7, )'
      out:
      - "%27%5B%5D%27"

# macOS jq converts NaN to an epoch date instead of reporting this error.
- q: 'try (nan | gmtime) catch .'
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "errror converting number of seconds since epoch to datetime"
    - v: '[1.7, )'
      output:
      - "error converting number of seconds since epoch to datetime"
    overrides:
    - v: '[1.7, )'
      os: MACOS
      output:
      - [1970, 0, 1, 0, 0, null, 4, 0]
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - "error converting number of seconds since epoch to datetime"
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  comment: 'jq 1.5 and 1.6 misspell this message; jackson-jq uses the corrected spelling on every supported version'


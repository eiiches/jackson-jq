    - v: '[1.6, 1.7)'
      output:
      - false
      runtime_error: "jq: error (at <stdin>:0): y\n"
    - v: '[1.7, )'
      output:
      - false
  types:
  - v: '[1.6, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.6, )'
    input: 'NULL'
    output: 'BOOLEAN'
  properties:
  - v: '[1.6, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  comment: 'From 1.7 on the break escapes the `?`, so error("y") is never evaluated. jq 1.6 raises "y" and then emits false.'

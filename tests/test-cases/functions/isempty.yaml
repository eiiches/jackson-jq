  input: {"a": 1}
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: isempty/1 is not defined at <top-level>, line 1:\ntry path(isempty(.a)) catch .         \njq: 1 compile error\n"
    - v: '[1.6, )'
      output:
      - "Invalid path expression with result false"
  types:

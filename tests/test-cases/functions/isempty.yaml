- q: '[isempty(try (1, 2) catch .)]'
  input: null
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: isempty/1 is not defined at <top-level>, line 1:\n[isempty(try (1, 2) catch .)] \njq: 1 compile error\n"
    - v: '[1.6, 1.7)'
      output:
      - [false, false]
    - v: '[1.7, )'
      output:
      - [false]
  types:
  - v: '[1.6, 1.7)'
    input: 'ANY'
    output: '[*:BOOLEAN]'
  - v: '[1.7, )'
    input: 'ANY'
    output: '[BOOLEAN]'
  - v: '[1.6, 1.7)'
    input: 'NULL'
    output: '[*:BOOLEAN]'
  - v: '[1.7, )'
    input: 'NULL'
    output: '[BOOLEAN]'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  comment: 'Two outputs. IsEmptyFunction does not branch on version; TryCatch does. Before 1.7 a `try` also catches errors raised downstream of it (TryCatch.applyLegacy), so it intercepts the short-circuit and runs its catch body, which emits again and re-triggers it. jq 1.6 behaves the same way for the same reason: its isempty is `0 == ((label $go | g | (1, break $go)) // 0)`, and the `try` swallows that break too.'

- q: '[isempty(try (1, 2) catch .)]'
  input: null
  expectations:
    default:
    - v: '[1.5, 1.6)'
      compile_error: "jq: error: isempty/1 is not defined at <top-level>, line 1:\n[isempty(try (1, 2) catch .)] \njq: 1 compile error\n"
    - v: '[1.6, 1.7)'
      output:
      - [false, false]
    - v: '[1.7, )'
      output:
      - [false]
  types:
  - v: '[1.6, 1.7)'
    input: 'ANY'
    output: '[*:BOOLEAN]'
  - v: '[1.7, )'
    input: 'ANY'
    output: '[BOOLEAN]'
  - v: '[1.6, 1.7)'
    input: 'NULL'
    output: '[*:BOOLEAN]'
  - v: '[1.7, )'
    input: 'NULL'
    output: '[BOOLEAN]'
  properties:
  - v: '[1.6, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  comment: 'One output. From 1.7 on TryCatch tunnels downstream errors through nested `try`s and rethrows them at their own boundary (DOWNSTREAM_ERRORS_ESCAPE_SINCE), so the short-circuit escapes the `try` rather than being caught by it. jq 1.7 made the matching change and redefined isempty as `first((g|false), true)`.'

- q: 'isempty((1?), error("y"))'
  input: null
  expectations:
    default:
    - v: '[1.5, 1.6)'

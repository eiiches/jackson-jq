- q: 'try ({"foo": [1,2,3,4,4,5,5,6]} | contains("foo")) catch .'
  expectations:
    default:
    - v: '[1.5, 1.8.2)'
      output:
      - "object ({\"foo\":[1,2...) and string (\"foo\") cannot have their containment checked"
    - v: '[1.8.2, )'
      output:
      - "object ({\"foo\":[1,2,3,4,4,5,5,6]}) and string (\"foo\") cannot have their containment checked"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false


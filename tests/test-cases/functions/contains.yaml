- q: 'contains("\u0000 jq ignores any string after \\0, but we do differently")'
  input: "anystring"
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - true
    - v: '[1.7, )'
      output:
      - false
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - false
      incompat_type: JACKSON_JQ_BUG
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'BOOLEAN'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  justification: This is more safe.

- q: 'contains("\u0000 jq ignores any string after \\0, but we do differently")'

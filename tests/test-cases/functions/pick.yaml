- q: 'pick(.a, .b.c, .x)'
  input: {"a": 1, "b": {"c": 2, "d": 3}, "e": 4}
  expectations:
    default:
    - v: '[1.5, 1.7)'
      compile_error: "jq: error: pick/1 is not defined at <top-level>, line 1:\npick(.a, .b.c, .x)\njq: 1 compile error\n"
    - v: '[1.7, )'
      output:
      - {"a": 1, "b": {"c": 2}, "x": null}
  types:
  - v: '[1.7, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.7, )'
    input: '{a:INT,b:{c:INT,d:INT},e:INT}'
    output: 'ANY'
  properties:
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  comment: 'pick/1 is added in jq-1.7, so this test is only valid for versions 1.7 and above'

- q: 'pick(.[2], .[0], .[0])'
  input: [1, 2, 3, 4]
  expectations:
    default:
    - v: '[1.5, 1.7)'
      compile_error: "jq: error: pick/1 is not defined at <top-level>, line 1:\npick(.[2], .[0], .[0])\njq: 1 compile error\n"
    - v: '[1.7, )'
      output:
      - [1, null, 3]
  types:
  - v: '[1.7, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.7, )'
    input: '[INT,INT,INT,INT]'
    output: 'ANY'
  properties:
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

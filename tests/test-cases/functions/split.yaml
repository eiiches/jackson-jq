- q: 'split("baz")'
  input: ""
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:STRING]'
  - v: '[1.5, )'
    input: 'STRING'
    output: '[*:STRING]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'split(empty)'
  input: []
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:STRING]'
  - v: '[1.5, )'
    input: '[]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: true
    depends_on_external_state: false

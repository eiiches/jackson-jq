- q: 'try @tsv catch .'
  input: [["[]"]]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "array ([\"[]\"]) is not valid in a csv row"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[[STRING]]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: '@tsv'
  input: [0.0]
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "0"
    - v: '[1.7, )'
      output:
      - "0.0"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: '[INT]'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '@tsv'
  input: [0.0]
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "0"
    - v: '[1.7, )'
      output:
      - "0.0"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: '[INT]'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '[0,null,nan,infinite] | @tsv'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "0\t\t\t1.7976931348623157e+308"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: '[[range(0; 128)] | implode] | @tsv'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "\\0\x01\x02\x03\x04\x05\x06\a\b\\t\\n\v\f\\r\x0e\x0f\x10\x11\x12\x13\x14\x15\x16\x17\x18\x19\x1a\e\x1c\x1d\x1e\x1f !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\\]^_`abcdefghijklmnopqrstuvwxyz{|}~\x7f"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

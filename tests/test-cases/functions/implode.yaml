    - v: '[1.6, 1.7)'
      output: []
      runtime_error: "jq-1.6: src/jv_unicode.c:101: jvp_utf8_encode: Assertion `codepoint >= 0 && codepoint <= 0x10FFFF' failed.\n"
    - v: '[1.7, )'
      output:
      - "\ufffd"
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - "\ufffd"
      incompat_type: INTENTIONAL

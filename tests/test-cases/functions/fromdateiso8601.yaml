- q: 'fromdateiso8601'
  input: "2023-09-30T00:00:00Z"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 1696032000
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try fromdateiso8601 catch .'
  input: "2023-09-30T00:00:00.000Z"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "date \"2023-09-30T00:00:00.000Z\" does not match format \"%Y-%m-%dT%H:%M:%SZ\""
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'to_entries'
  input: [61, 62]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - [{"key": 0, "value": 61}, {"key": 1, "value": 62}]
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: '[*:{key:INT,value:ANY}]|[*:{key:STRING,value:ANY}]'
  - v: '[1.5, )'
    input: '[INT,INT]'
    output: '[*:{key:INT,value:INT}]'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try ("abcdefghijklm" | to_entries) catch .'
  expectations:
    default:
    - v: '[1.5, 1.8.2)'
      output:
      - "string (\"abcdefghij...) has no keys"
    - v: '[1.8.2, )'
      output:
      - "string (\"abcdefghijklm\") has no keys"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

- q: 'try ("abcdefghijklm" | to_entries) catch .'
  expectations:
    default:
    - v: '[1.5, 1.8.2)'
      output:
      - "string (\"abcdefghij...) has no keys"
    - v: '[1.8.2, )'
      output:
      - "string (\"abcdefghijklm\") has no keys"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false

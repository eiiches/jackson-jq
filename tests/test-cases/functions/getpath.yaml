- q: 'getpath([{"start": nan, "end": 2}])'
  input: [1, 2, 3]
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output: []
      runtime_error: "jq-1.5: ../../../jv_aux.c:47: parse_slice: Assertion `0 <= start && start <= end && end <= len' failed.\n"
    - v: '[1.6, 1.7)'
      output: []
      runtime_error: "jq-1.6: src/jv_aux.c:47: parse_slice: Assertion `0 <= start && start <= end && end <= len' failed.\n"
    - v: '[1.7, )'
      output:
      - [1, 2]
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - [1.0, 2.0]
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[INT,INT,INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

# An array slice path segment must carry both "start" and "end". An explicit null means an open
# bound, but a missing field is an error.
- q: 'try (getpath([{}])) catch .'
  input: [1, 2, 3]
  expectations:
    default:
    - v: '[1.5, 1.7)'
      output:
      - "Start and end indices of an array slice must be numbers"
    - v: '[1.7, )'
      output:
      - "Array/string slice indices must be integers"
    jjq:
    - v: '[1.7, )'
      output:
      - "Start and end indices of an array slice must be numbers"
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[INT,INT,INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false


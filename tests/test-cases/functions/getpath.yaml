- q: 'getpath([])'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "foo"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


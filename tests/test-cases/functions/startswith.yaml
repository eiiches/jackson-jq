- q: 'startswith(empty)'
  out: []
  types:
  - input: 'ANY'
    output: 'BOOLEAN'
  - input: 'NULL'
    output: 'ANY'
  v: '[1.5, )'

- q: 'startswith(.)'
  in: "foo"
  out:
  - true
  types:
  - input: 'ANY'
    output: 'BOOLEAN'
  - input: 'STRING'
    output: 'BOOLEAN'
  v: '[1.5, )'

- q: 'try startswith("foo") catch .'
  out:
  - "startswith() requires string inputs"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

- q: 'try startswith(1) catch .'
  in: "foo"
  out:
  - "startswith() requires string inputs"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'ANY'

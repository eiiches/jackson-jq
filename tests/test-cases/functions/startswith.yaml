- q: 'startswith(empty)'
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: true
    depends_on_external_state: false

- q: 'startswith(.)'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'BOOLEAN'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try startswith("foo") catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "startswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try startswith(1) catch .'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "startswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

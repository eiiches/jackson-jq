- q: '@base64d'
  in: 'WyJiYXIiXQ=="name"'
  comment: 'jq stops decoding at the first = and discards the rest of the input, so the quoted text after the padding is ignored rather than rejected'
  expectations:
    default:
    - v: '[1.6, )'
      out:
      - "[\"bar\"]"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'STRING'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '@base64d'
  in: "YWJjZA=X"
  comment: 'a single = ends the input just as a full pad does'
  expectations:
    default:
    - v: '[1.6, )'
      out:
      - "abcd"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'STRING'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '@base64d'
  in: "YQ==YQ=="
  comment: 'the second base64 chunk is past the padding and never read'
  expectations:
    default:
    - v: '[1.6, )'
      out:
      - "a"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'STRING'
    output: 'STRING'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: '@base64d'
  in: "YQ="
  comment: 'one pad character where two are canonical'
  expectations:

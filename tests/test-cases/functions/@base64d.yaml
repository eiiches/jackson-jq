- q: '@base64d'
  in: 720
  expectations:
    default:
    - v: '[1.6, )'
      out:
      - "�"
  types:
  - input: 'ANY'
    output: 'STRING'
  - input: 'INT'
    output: 'ANY'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


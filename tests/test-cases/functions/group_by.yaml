- q: 'group_by(nan)'
  in: [1, 2]
  out:
  - [[1], [2]]
  types:
  - input: 'ANY'
    output: '[*:[*:ANY]]'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  v: '[1.5, )'

- q: 'group_by(nan)'
  in: [1970, 0, 1, 9, 0, 18, 4, 0]
  types:
  - input: 'ANY'
    output: '[*:[*:ANY]]'
  properties:
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false
  expectations:
    default:
    - v: '[1.5, )'
      out:
      - [[1970], [0], [1], [9], [0], [18], [4], [0]]
    overrides:
    - v: '[1.7, )'
      os: MACOS
      out:
      - [[0], [0], [1], [9], [1970], [18], [4], [0]]

- q: 'group_by(if . % 2 == 0 then nan else 0 end)'
  in: [4, 1, 3, 2]

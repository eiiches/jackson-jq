# Linux jq 1.8 and later accept an empty datetime array; macOS jq reports an error.
- q: 'try mktime catch .'
  input: []
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - "mktime requires parsed datetime inputs"
    - v: '[1.8.0, )'
      output:
      - -2209075200
    overrides:
    - v: '[1.8.0, )'
      os: MACOS
      output:
      - "invalid gmtime representation"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  comment: 'on Linux, jq 1.8.0 started reading an array with fewer than eight elements, so an empty one names the zeroth of January 1900'


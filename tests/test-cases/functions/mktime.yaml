- q: 'mktime'
  input: [1970, 0, 1, 0, 0, 0, 4, 0]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - 0
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NUMBER'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT,INT,INT,INT,INT]'
    output: 'NUMBER'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


- q: 'try mktime catch .'
  input: [1969, 11, 31, 23, 59, 59, 3, 364]
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "invalid gmtime representation"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT,INT,INT,INT,INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  comment: 'The fuzz input names epoch second -1, which jq treats as an invalid gmtime representation.'

- q: 'try mktime catch .'
  input: [1970, 0, 1, 0, 0, -1]
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - "mktime requires parsed datetime inputs"
    - v: '[1.8.0, )'
      output:
      - "invalid gmtime representation"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT,INT,INT]'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  comment: 'A minimal broken-down time can reach the same -1 epoch second by carrying a negative seconds field.'

- q: 'mktime'
  input: [1969, 11, 31, 23, 59, 57, 3, 364]
  expectations:

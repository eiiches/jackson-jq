- q: 'try @csv catch .'
  in: {}
  out:
  - "object ({}) cannot be csv-formatted, only array"

- q: '@csv'
  in: [0.0]
  out:
  - "0"
  v: '[1.5, 1.7)'

- q: '@csv'
  in: [0.0]
  out:
  - "0.0"
  v: '[1.7, )'
  failing: true

- q: '[0,null,nan,infinite] | @csv'
  out:
  - "0,,,1.7976931348623157e+308"

- q: '[[range(0; 128)] | implode] | @csv'
  out:
  - "\"\\0\x01\x02\x03\x04\x05\x06\a\b\t\n\v\f\r\x0E\x0F\x10\x11\x12\x13\x14\x15\x16\x17\x18\x19\x1A\e\x1C\x1D\x1E\x1F !\"\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~\x7F\""

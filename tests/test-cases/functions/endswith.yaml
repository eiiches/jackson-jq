- q: 'endswith(empty)'
  expectations:
    default:
    - v: '[1.5, )'
      output: []
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: ZERO
    depends_on_input: true
    depends_on_external_state: false

- q: 'endswith(.)'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - true
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'BOOLEAN'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'BOOLEAN'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'try endswith("foo") catch .'
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "endswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

- q: 'try endswith(1) catch .'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, )'
      output:
      - "endswith() requires string inputs"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'STRING'
    output: 'ANY'
  properties:
  - v: '[1.5, )'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false

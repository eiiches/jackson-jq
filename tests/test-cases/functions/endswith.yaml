- q: 'endswith(empty)'
  out: []
  types:
  - input: 'ANY'
    output: 'BOOLEAN'
  - input: 'NULL'
    output: 'ANY'
  v: '[1.5, )'

- q: 'endswith(.)'
  in: "foo"
  out:
  - true
  types:
  - input: 'ANY'
    output: 'BOOLEAN'
  - input: 'STRING'
    output: 'BOOLEAN'
  v: '[1.5, )'

- q: 'try endswith("foo") catch .'
  out:
  - "endswith() requires string inputs"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'

- q: 'try endswith(1) catch .'
  in: "foo"
  out:
  - "endswith() requires string inputs"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'STRING'
    output: 'ANY'

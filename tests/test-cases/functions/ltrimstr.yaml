- q: 'ltrimstr(., .[0:1], [1,2,3])'
  input: "foo"
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - ""
      - "oo"
      - "foo"
    - v: '[1.8.0, )'
      output:
      - ""
      - "oo"
      runtime_error: "jq: error (at <stdin>:0): startswith() requires string inputs\n"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, 1.8.0)'
    input: 'STRING'
    output: 'ANY'
  - v: '[1.8.0, )'
    input: 'STRING'
    output: 'STRING'
  properties:
  - v: '[1.5, 1.8.0)'
    cardinality: UNKNOWN
    depends_on_input: true
    depends_on_external_state: false
  - v: '[1.8.0, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false

- q: 'del(ltrimstr(isnan))'
  input: [91, 34, 45, 49, 46, 49, 48, 55, 49, 52, 56, 55, 49, 55, 55, 57, 52, 48, 57, 48, 52, 98, 97, 122, 34, 93]
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - null
    - v: '[1.8.0, )'
      output: []
      runtime_error: "jq: error (at <stdin>:0): startswith() requires string inputs\n"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'NULL|[*:ANY]|{*:ANY}'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT]'
    output: 'NULL|[*:ANY]|{*:ANY}'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


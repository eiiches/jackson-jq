- q: 'path(null)'
  out:
  - []
  types:
  - input: 'ANY'
    output: '[*:NUMBER|STRING]'
  - input: 'NULL'
    output: '[*:NUMBER|STRING]'
  v: '[1.5, )'

- q: 'path(.["x":"y"])'
  in: null
  out:
  - [{"start": "x", "end": "y"}]
  types:
  - input: 'ANY'
    output: '[*:NUMBER|STRING]'
  - input: 'NULL'
    output: '[*:NUMBER|STRING]'
  v: '[1.5, )'

- q: 'path(.a.b[])'
  in: {"a": {"b": [1, 2]}}
  out:
  - ["a", "b", 0]
  - ["a", "b", 1]
  types:
  - input: 'ANY'
    output: '[*:NUMBER|STRING]'
  - input: '{a:{b:[INT,INT]}}'
    output: '[*:NUMBER|STRING]'

- q: '{} | try path(.[0]) catch .'
  out:
  - "Cannot index object with number"
  types:
  - input: 'ANY'
    output: 'ANY'
  - input: 'NULL'
    output: 'ANY'
  v: '[1.5, 1.8.2)'

- q: '{} | try path(.[0]) catch .'

# Darwin strftime pads this noncanonical year to four digits, unlike glibc.
- q: 'todateiso8601'
  input: [49, 57, 55, 48, 45, 48, 49, 45, 48, 49, 84, 48, 48, 58, 48, 48, 58, 49, 57, 90]
  expectations:
    default:
    - v: '[1.5, 1.8.0)'
      output:
      - "49-58-55T48:45:48Z"
    - v: '[1.8.0, )'
      output:
      - "53-11-26T00:45:48Z"
    overrides:
    - v: '[1.7, )'
      os: MACOS
      output:
      - "0049-58-55T48:45:48Z"
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'STRING'
  - v: '[1.5, )'
    input: '[INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT,INT]'
    output: 'STRING'
  properties:
  - v: '[1.5, )'
    cardinality: ONE
    depends_on_input: true
    depends_on_external_state: false


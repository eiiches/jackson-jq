# macOS jq 1.7 converts NaN to an epoch date; jq 1.8 reports a strftime input error.
- q: 'try (nan | todateiso8601) catch .'
  expectations:
    default:
    - v: '[1.5, 1.6)'
      output: []
      runtime_error: "jq-1.5: ../../../jv.c:324: jv_array_get: Assertion `jv_get_kind(j) == JV_KIND_ARRAY' failed.\n"
    - v: '[1.6, 1.7)'
      output: []
      runtime_error: "jq-1.6: src/jv.c:333: jv_array_get: Assertion `jv_get_kind(j) == JV_KIND_ARRAY' failed.\n"
    - v: '[1.7, )'
      output:
      - "error converting number of seconds since epoch to datetime"
    overrides:
    - v: '[1.7, 1.8.0)'
      os: MACOS
      output:
      - "1970-01-01T00:00:00Z"
    - v: '[1.8.0, )'
      os: MACOS
      output:
      - "strftime/1 requires parsed datetime inputs"
    jjq:
    - v: '[1.5, 1.7)'
      output:
      - "error converting number of seconds since epoch to datetime"
      incompat_type: INTENTIONAL
  types:
  - v: '[1.5, )'
    input: 'ANY'
    output: 'ANY'
  - v: '[1.5, )'
    input: 'NULL'
    output: 'ANY'
  properties:
  - v: '[1.5, 1.7)'
    cardinality: UNKNOWN
    depends_on_input: false
    depends_on_external_state: false
  - v: '[1.7, )'
    cardinality: ONE
    depends_on_input: false
    depends_on_external_state: false
  comment: 'jq 1.5 and 1.6 fail with a native assertion; jackson-jq returns the caught error string on every supported version'


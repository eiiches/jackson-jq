# Kept by hand rather than imported: jq's own corpus asks only whether the round trip is exact
# (`... == $powers`), which says nothing about what it produced when it is not. Comparing the values
# needs a tolerance, since pow and log2 are libm's and neither jq nor this library promises the last
# bit of a double.
- q: '[range(-52;52;1)] as $powers | [$powers[]|pow(2;.)|log2]'
  input: null
  expectations:
    default:
    - v: '[1.5, )'
      output:

# zstd-jni loads its bundled JNI library from the static initializer of
# com.github.luben.zstd.util.Native. Under a build system that initializes classes at build time
# by default -- Quarkus does -- that load runs inside the image builder and bakes the "already
# loaded" flag into the image heap, so the executable never loads the library and every native
# call fails with UnsatisfiedLinkError. GraalVM's own default is run-time initialization; this
# states it explicitly for everyone.
Args = --initialize-at-run-time=com.github.luben.zstd,com.github.luben.zstd.util

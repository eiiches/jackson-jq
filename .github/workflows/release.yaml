name: 'release'
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'release version; e.g. 0.0.1'
        required: true
      next_snapshot_version:
        description: 'next snapshot version; e.g. 0.0.2-SNAPSHOT'
        required: true

jobs:
  release:
    permissions:
      # git push --tags / --all. Stated rather than inherited from the repository default so
      # that this and release-rehearsal's `contents: read` read as a deliberate pair.
      contents: write
    uses: ./.github/workflows/reusable-release.yaml
    with:
      release_version: ${{ github.event.inputs.release_version }}
      next_snapshot_version: ${{ github.event.inputs.next_snapshot_version }}
      push: true
    secrets: inherit

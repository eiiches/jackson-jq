name: 'test-pull-requests'
on:
  pull_request:
    branches:
    - develop/2.x
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java-env:
          - name: "JDK 21"
            java-version: "21"
            distribution: "temurin"
            maven-command: "mvn clean package"
          - name: "GraalVM 21"
            java-version: "21"
            distribution: "graalvm"
            maven-command: "mvn clean package -Pnative"
    name: "Build with ${{ matrix.java-env.name }}"
    steps:
    - uses: actions/checkout@v5.0.0
    
    - name: Set up JDK 21
      if: matrix.java-env.name == 'JDK 21'
      uses: actions/setup-java@v5.0.0
      with:
        java-version: ${{ matrix.java-env.java-version }}
        distribution: ${{ matrix.java-env.distribution }}

    - name: Set up GraalVM 21
      if: matrix.java-env.name == 'GraalVM 21'
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ matrix.java-env.java-version }}
        distribution: ${{ matrix.java-env.distribution }}

    - name: Download jq-1.5 and jq-1.6
      run: |
        mkdir -p $HOME/bin
        wget -O $HOME/bin/jq-1.5 https://github.com/stedolan/jq/releases/download/jq-1.5/jq-linux64
        wget -O $HOME/bin/jq-1.6 https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
        wget -O $HOME/bin/jq-1.7 https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
        chmod +x $HOME/bin/jq-1.5 $HOME/bin/jq-1.6 $HOME/bin/jq-1.7

    - name: Build & Deploy
      run: 'PATH="$HOME/bin:$PATH" ${{ matrix.java-env.maven-command }}'

  compatibility-tests:
    runs-on: ubuntu-22.04
    name: "Java 8, OSGi, JPMS, and GraalVM compatibility"
    steps:
    - uses: actions/checkout@v5.0.0

    - name: Set up JDK 21
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download jq-1.5 and jq-1.6
      run: |
        mkdir -p $HOME/bin
        wget -O $HOME/bin/jq-1.5 https://github.com/stedolan/jq/releases/download/jq-1.5/jq-linux64
        wget -O $HOME/bin/jq-1.6 https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
        wget -O $HOME/bin/jq-1.7 https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
        chmod +x $HOME/bin/jq-1.5 $HOME/bin/jq-1.6 $HOME/bin/jq-1.7

    - name: Install reactor artifacts
      run: 'PATH="$HOME/bin:$PATH" mvn clean install'

    - name: Set up JDK 8
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Test Java 8 compatibility
      run: mvn -f smoke-tests/java8/pom.xml clean verify

    - name: Set up JDK 17
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Test OSGi compatibility
      run: mvn -f smoke-tests/osgi/pom.xml clean verify

    - name: Test JPMS compatibility
      run: mvn -f smoke-tests/jpms/pom.xml clean verify

    - name: Set up GraalVM 21
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm'

    - name: Test GraalVM compatibility
      run: mvn -f smoke-tests/graalvm/pom.xml clean verify

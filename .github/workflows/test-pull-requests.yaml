name: 'test-pull-requests'
on:
  pull_request:
    branches:
    - develop/2.x
jobs:
  lint:
    runs-on: ubuntu-26.04
    name: "Lint"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: true
        bazelrc: |
          ${{ vars.BAZELRC }}
          ${{ secrets.SECRET_BAZELRC }}

    - name: Check Java formatting
      run: bazel run //:idea-format -- --check

    - name: Check Bazel formatting
      run: bazel run //:buildifier_test

  build:
    runs-on: ubuntu-26.04
    name: "Build and Test"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 26
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: true
        bazelrc: |
          ${{ vars.BAZELRC }}
          ${{ secrets.SECRET_BAZELRC }}

    - name: Build and test
      run: bazel test --remote_download_outputs=minimal //...

    - name: Install artifacts for Maven consumers
      run: bazel run //:maven_install

    - name: Set up JDK 8
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Test Java 8 compatibility
      run: mvn -f smoke-tests/java8/pom.xml clean verify

    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Test OSGi compatibility
      run: mvn -f smoke-tests/osgi/pom.xml clean verify

    - name: Test JPMS compatibility
      run: mvn -f smoke-tests/jpms/pom.xml clean verify

  # Split out of `build` because the native image builds dominate its wall-clock time.
  # Neither job needs `bazel test //...`; the smoke tests only consume the published
  # artifacts, so they build just those. `cache-save: false` leaves the shared disk cache
  # to `build`, whose Bazel invocation is a superset of these.
  quarkus:
    runs-on: ubuntu-26.04
    name: "Quarkus Smoke Test"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Bazel ignores this JDK -- .bazelrc pins --java_runtime_version=remotejdk_21 -- but
    # setting it up before Bazel keeps a mid-job JAVA_HOME change from restarting the server.
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: false
        bazelrc: |
          ${{ vars.BAZELRC }}
          ${{ secrets.SECRET_BAZELRC }}

    - name: Install artifacts for Maven consumers
      run: bazel run //:maven_install

    - name: Test Quarkus compatibility (JVM)
      run: mvn -f smoke-tests/quarkus/pom.xml clean verify

    - name: Set up GraalVM 21
      uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        java-version: '21'
        distribution: 'graalvm'

    - name: Test Quarkus compatibility (native)
      run: mvn -f smoke-tests/quarkus/pom.xml clean verify -Pnative

  graalvm:
    runs-on: ubuntu-26.04
    name: "GraalVM Smoke Test"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up GraalVM 21
      uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        java-version: '21'
        distribution: 'graalvm'
        cache: 'maven'

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: false
        bazelrc: |
          ${{ vars.BAZELRC }}
          ${{ secrets.SECRET_BAZELRC }}

    - name: Install artifacts for Maven consumers
      run: bazel run //:maven_install

    - name: Test GraalVM compatibility
      run: mvn -f smoke-tests/graalvm/pom.xml clean verify

  macos-arm64:
    runs-on: macos-15
    name: "Build and Test (macOS ARM64)"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: true
        bazelrc: |
          ${{ vars.BAZELRC }}
          ${{ secrets.SECRET_BAZELRC }}

    - name: Build and test
      run: bazel test --remote_download_outputs=minimal //...

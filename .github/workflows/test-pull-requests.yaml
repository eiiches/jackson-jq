name: 'test-pull-requests'
on:
  pull_request:
    branches:
    - develop/1.x
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java-env:
          - name: "JDK 1.8"
            java-version: "8"
            distribution: "temurin"
            maven-command: "mvn clean package"
          - name: "GraalVM 21"
            java-version: "21"
            distribution: "graalvm-community"
            maven-command: "mvn clean package -Pnative"
    name: "Build with ${{ matrix.java-env.name }}"
    steps:
    - uses: actions/checkout@v5.0.0
    
    - name: Set up JDK 1.8
      if: matrix.java-env.name == 'JDK 1.8'
      uses: actions/setup-java@v4.7.1
      with:
        java-version: ${{ matrix.java-env.java-version }}
        distribution: ${{ matrix.java-env.distribution }}

    - name: Set up GraalVM 21
      if: matrix.java-env.name == 'GraalVM 21'
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ matrix.java-env.java-version }}
        distribution: ${{ matrix.java-env.distribution }}

    - name: Download jq-1.5 and jq-1.6
      run: |
        mkdir -p $HOME/bin
        wget -O $HOME/bin/jq-1.5 https://github.com/stedolan/jq/releases/download/jq-1.5/jq-linux64
        wget -O $HOME/bin/jq-1.6 https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
        wget -O $HOME/bin/jq-1.7 https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
        chmod +x $HOME/bin/jq-1.5 $HOME/bin/jq-1.6 $HOME/bin/jq-1.7

    - name: Build & Deploy
      run: 'PATH="$HOME/bin:$PATH" ${{ matrix.java-env.maven-command }}'

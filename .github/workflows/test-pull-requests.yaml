name: 'test-pull-requests'
on:
  pull_request:
    branches:
    - develop/2.x
jobs:
  build:
    runs-on: ubuntu-26.04
    name: "Build and Test"
    steps:
    - uses: actions/checkout@v5.0.0

    - name: Set up JDK 26
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache jq binaries
      uses: actions/cache@v5.0.5
      with:
        path: ~/bin/jq-*
        key: jq-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/download-jq-binaries.sh') }}

    - name: Download jq binaries
      run: scripts/download-jq-binaries.sh $HOME/bin

    - name: Build, test, and install artifacts
      run: 'PATH="$HOME/bin:$PATH" mvn clean install'

    - name: Set up JDK 8
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Test Java 8 compatibility
      run: mvn -f smoke-tests/java8/pom.xml clean verify

    - name: Set up JDK 17
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Test OSGi compatibility
      run: mvn -f smoke-tests/osgi/pom.xml clean verify

    - name: Test JPMS compatibility
      run: mvn -f smoke-tests/jpms/pom.xml clean verify

    - name: Test Quarkus compatibility (JVM)
      run: mvn -f smoke-tests/quarkus/pom.xml clean verify

    - name: Set up GraalVM 21
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm'

    - name: Test GraalVM compatibility
      run: mvn -f smoke-tests/graalvm/pom.xml clean verify

    - name: Test Quarkus compatibility (native)
      run: mvn -f smoke-tests/quarkus/pom.xml clean verify -Pnative

# this name appears in the badge
name: 'test'
on:
  push:
    branches:
    - develop/2.x
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Bazel
      uses: ./.github/actions/setup-bazel
      with:
        bazelrc: ${{ vars.BAZELRC }}
        build-buddy-bazelrc: ${{ vars.BUILD_BUDDY_BAZELRC }}
        build-buddy-api-key: ${{ secrets.BUILD_BUDDY_API_KEY }}

    - name: Build and test
      run: bazel test --remote_download_outputs=minimal //...

    # Built as a separate step: `bazel run` would put the credentials in Bazel's client
    # environment, which Bazel writes verbatim into $(bazel info output_base)/java.log*.
    # The built script needs no Bazel server, so running it directly keeps the secrets in
    # this step's process only.
    - name: Build publisher
      run: bazel build //:maven_install

    - name: Deploy snapshot
      env:
        MAVEN_REPO: https://central.sonatype.com/repository/maven-snapshots/
        MAVEN_USER: ${{ secrets.MAVEN_USER }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: bazel-bin/maven_install

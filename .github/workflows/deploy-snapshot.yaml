# this name appears in the badge
name: 'test'
on:
  push:
    branches:
    - develop/2.x
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Set up JDK 26
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Download jq binaries
      run: scripts/download-jq-binaries.sh $HOME/bin

    - name: Configure Maven
      env:
        M2_SETTINGS_XML: ${{ secrets.M2_SETTINGS_XML }}
      run: |
        mkdir -p $HOME/.m2
        echo "$M2_SETTINGS_XML" > $HOME/.m2/settings.xml

    - name: Build & Deploy
      run: 'PATH="$HOME/bin:$PATH" mvn clean deploy'

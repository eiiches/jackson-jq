name: Set up Bazel
description: Set up Bazel caches and optionally enable authenticated BuildBuddy services.

inputs:
  bazelrc:
    description: Bazel configuration used by every workflow run.
    required: false
    default: ""
  build-buddy-bazelrc:
    description: BuildBuddy configuration used only when an API key is available.
    required: false
    default: ""
  build-buddy-api-key:
    description: BuildBuddy API key.
    required: false
    default: ""
  cache-save:
    description: Whether to save Bazel caches at the end of the job.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure BuildBuddy credential helper
      id: buildbuddy
      if: inputs.build-buddy-api-key != ''
      shell: bash
      env:
        BUILD_BUDDY_API_KEY: ${{ inputs.build-buddy-api-key }}
      run: |
        set -euo pipefail

        umask 077
        credential_directory="$(mktemp -d "${RUNNER_TEMP}/jackson-jq-buildbuddy.XXXXXX")"
        printf '%s' "$BUILD_BUDDY_API_KEY" > "${credential_directory}/api-key"
        chmod 600 "${credential_directory}/api-key"
        cp "${GITHUB_ACTION_PATH}/buildbuddy-credential-helper.py" "${credential_directory}/credential-helper"
        chmod 700 "${credential_directory}/credential-helper"
        printf 'credential_helper=%s\n' "${credential_directory}/credential-helper" >> "$GITHUB_OUTPUT"

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-${{ runner.arch }}
        repository-cache: true
        cache-save: ${{ inputs.cache-save }}
        bazelrc: |
          ${{ inputs.bazelrc }}
          ${{ inputs.build-buddy-api-key != '' && inputs.build-buddy-bazelrc || '' }}
          ${{ inputs.build-buddy-api-key != '' && format('common --credential_helper=remote.buildbuddy.io={0}', steps.buildbuddy.outputs.credential_helper) || '' }}

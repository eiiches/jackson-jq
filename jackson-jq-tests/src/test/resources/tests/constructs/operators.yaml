  - {"x": 10, "y": 1}
  v: '[1.5, 1.8.0)'
  failing: true

- q: '{"x": 10} + . as {"a": $a} | {"y": $a}'
  in: {"a": 1, "b": 2}
  out:
  - {"y": 1}
  v: '[1.8.0, )'

- q: '({"x": 10} + .) as {"a": $a} | {"y": $a}'
  in: {"a": 1, "b": 2}
  out:
  - {"y": 1}

- q: '{"x": 10} + (. as {"a": $a} | {"y": $a})'
  in: {"a": 1, "b": 2}
  out:
  - {"x": 10, "y": 1}

- q: '1 + 3 as $a | ($a * 2)'
  in: null
  out:
  - 7

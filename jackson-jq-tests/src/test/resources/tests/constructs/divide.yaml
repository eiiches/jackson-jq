- q: '"foo" / "o"'
  out:
  - ["f", "", ""]

- q: '(("foo" // 1) / "foo")'
  in: "foo"
  out:
  - ["", ""]
  v: '[1.5, )'

- q: '"" / ""'
  out:
  - []

- q: '"foo" / ""'
  out:
  - ["f", "o", "o"]

- q: '"" / "foo"'
  out:
  - []

- q: 'error("foo") / empty'
  out: []
  comment: 'rhs is evaluated first'

- q: 'try (empty / error("foo")) catch .'
  out:
  - "foo"

- q: 'try (./nan) catch .'
  out:
  - "null (null) and number (null) cannot be divided"

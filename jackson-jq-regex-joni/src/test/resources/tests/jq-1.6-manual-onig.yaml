- q: 'walk( if type == "object" then with_entries( .key |= sub( "^_+"; "") ) else . end )'
  in: [{"_a": {"__b": 2}}]
  out:
  - [{"a": {"b": 2}}]
  v: '[1.6, 1.6]'
- q: 'test("foo")'
  in: "foo"
  out:
  - true
  v: '[1.6, 1.6]'
- q: '.[] | test("a b c # spaces are ignored"; "ix")'
  in: ["xabcd", "ABC"]
  out:
  - true
  - true
  v: '[1.6, 1.6]'
- q: 'match("(abc)+"; "g")'
  in: "abc abc"
  out:
  - {"offset": 0, "length": 3, "string": "abc", "captures": [{"offset": 0, "length": 3, "string": "abc", "name": null}]}
  - {"offset": 4, "length": 3, "string": "abc", "captures": [{"offset": 4, "length": 3, "string": "abc", "name": null}]}
  v: '[1.6, 1.6]'
- q: 'match("foo")'
  in: "foo bar foo"
  out:
  - {"offset": 0, "length": 3, "string": "foo", "captures": []}
  v: '[1.6, 1.6]'
- q: 'match(["foo", "ig"])'
  in: "foo bar FOO"
  out:
  - {"offset": 0, "length": 3, "string": "foo", "captures": []}
  - {"offset": 8, "length": 3, "string": "FOO", "captures": []}
  v: '[1.6, 1.6]'
- q: 'match("foo (?<bar123>bar)? foo"; "ig")'
  in: "foo bar foo foo  foo"
  out:
  - {"offset": 0, "length": 11, "string": "foo bar foo", "captures": [{"offset": 4, "length": 3, "string": "bar", "name": "bar123"}]}
  - {"offset": 12, "length": 8, "string": "foo  foo", "captures": [{"offset": -1, "length": 0, "string": null, "name": "bar123"}]}
  ignore_field_order: true # capture objects don't have consistent field order
  v: '[1.6, 1.6]'
- q: '[ match("."; "g")] | length'
  in: "abc"
  out:
  - 3
  v: '[1.6, 1.6]'
- q: 'capture("(?<a>[a-z]+)-(?<n>[0-9]+)")'
  in: "xyzzy-14"
  out:
  - {"a": "xyzzy", "n": "14"}
  v: '[1.6, 1.6]'
